[package]
name = "miren"
description = "Experimental Rust MIR analysis for panic freedom and function contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
syn.workspace = true

[dev-dependencies]
critical-section = "=1.2.0"
miren-contracts = { path = "../miren-contracts" }
portable-atomic = "=1.15.0"
quote.workspace = true
static_cell = "=2.1.1"

[[bin]]
name = "miren"
path = "src/main.rs"

[[bin]]
name = "cargo-miren"
path = "src/cargo.rs"

[[bin]]
name = "miren-rustc"
path = "src/compiler.rs"
